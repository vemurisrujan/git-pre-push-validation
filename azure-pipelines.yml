
trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

pool:
  vmImage: 'Default'

steps:
  - task: UsePythonVersion@0
    displayName: 'Set up Python'
    inputs:
      versionSpec: '3.11'
      architecture: 'x64'

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: 'Install dependencies'

  - script: |
      python -m pytest -v
    displayName: 'Run automated tests'

  - script: |
      python -m ruff check .
    displayName: 'Run Ruff lint'

  - script: |
      python -m ruff format --check .
    displayName: 'Check Python formatting'
  
  - task: SonarQubePrepare@8
    inputs:
      SonarQube: 'Vemuri_Sonarqube'
      scannerMode: 'cli'
      configMode: 'manual'
      cliProjectKey: 'git-pre-push-validation_git-pre-push-validation_893fae19-0361-43e2-acc2-c308cc04e4bc'
      cliProjectName: 'git-pre-push-validation'
      cliSources: '.'

  - task: SonarQubeAnalyze@8
    inputs:
      jdkversion: 'JAVA_HOME_17_X64'
  
  - task: SonarQubePublish@8
    inputs:
      pollingTimeoutSec: '300'

